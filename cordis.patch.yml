- insert:
    - id: memory-spaces
      name: dsh-memory-spaces
      config:
        databasePath: !!js >-
          process.env.DSH_MEMORY_SPACES_DATABASE_PATH?.trim() || 'profile:memory-spaces-v4.sqlite'
        journalMode: wal
        busyTimeoutMs: 5000
        maxMemoryBytes: 8192
        maxQueryBytes: 4096
        maxRecallItems: 8
        maxRecallBytes: 16384
        historySummaryProvider: ''
        historySummaryModel: ''
        historySummaryMaxTokens: 1200
        maxHistoryImportBytes: 65536
