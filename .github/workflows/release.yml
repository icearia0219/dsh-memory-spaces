name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  metadata:
    name: Verify release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: node ./scripts/release-metadata.mjs "$GITHUB_REF_NAME"

  verify:
    name: Run the complete release matrix
    needs: metadata
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: [metadata, verify]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global "npm@^11.5.1"
      - run: pnpm install --frozen-lockfile
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}

  github-release:
    name: Create GitHub Release
    needs: [metadata, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: node ./scripts/release-metadata.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-notes.md"
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
